<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>咯蛋</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="咯蛋">
<meta name="theme-color" content="#6FD3BE">
<style>
  :root{
    --rose:#FF2E7E;
    --rose-deep:#C4145A;
    --mint:#6FD3BE;
    --mint-deep:#3FA793;
    --cream:#FFF6E8;
    --ink:#14302B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:var(--mint);
    background-image:radial-gradient(var(--mint-deep) 1.5px,transparent 1.6px);
    background-size:26px 26px;
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    padding:20px;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }

  .shell{
    width:min(340px,92vw);
    background:var(--rose);
    border:5px solid var(--ink);
    border-radius:46px 46px 60px 60px;
    padding:22px 20px 26px;
    box-shadow:0 10px 0 var(--rose-deep),0 14px 30px rgba(20,48,43,.3);
  }
  .name{
    text-align:center;font-size:12px;letter-spacing:.42em;text-indent:.42em;
    color:var(--cream);margin-bottom:14px;
  }

  .screen{
    position:relative;
    aspect-ratio:1/.86;
    background:var(--ink);
    border:4px solid var(--ink);
    border-radius:20px;
    overflow:hidden;
    isolation:isolate;
  }
  .screen::before{
    content:"";
    position:absolute;inset:0;
    background:var(--cream);
    background-image:radial-gradient(rgba(63,167,147,.5) 1.2px,transparent 1.3px);
    background-size:15px 15px;
    border-radius:16px;
    z-index:0;
  }
  .screen > *{position:relative;z-index:1}
  .debris,.grass,.tracks{position:absolute;inset:0;z-index:1}
  .screen.night{filter:brightness(.62) saturate(.7)}

  .bars{position:absolute;top:9px;left:10px;display:grid;gap:5px;font-size:9px;letter-spacing:.1em}
  .bar{display:flex;align-items:center;gap:5px}
  .bar b{font-weight:700;width:22px}
  .track{width:62px;height:7px;border:2px solid var(--ink);border-radius:4px;overflow:hidden}
  .fill{display:block;height:100%;transition:width .35s ease}
  .f1{background:var(--rose)}.f2{background:var(--mint-deep)}.f3{background:var(--ink)}

  .age{position:absolute;top:9px;right:10px;font-size:9px;letter-spacing:.1em;opacity:.7}

  .pet{
    position:absolute;left:50%;bottom:18%;
    transform:translateX(-50%);
    transition:left .4s ease;
    animation:bob .6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{margin-bottom:0}50%{margin-bottom:6px}}
  .pet.sleeping{animation:none;opacity:.85}
  .pet.eat{animation:peck .35s ease-in-out 2}
  @keyframes peck{0%,100%{transform:translateX(-50%) rotate(0)}45%{transform:translateX(-50%) rotate(24deg)}}
  .pet.play{animation:hop .3s ease-in-out 3}
  @keyframes hop{0%,100%{margin-bottom:0}50%{margin-bottom:26px}}

  .inner{transform-origin:50% 100%;transition:transform .18s ease}
  .pet.grown svg{width:112px;height:122px}
  .inner.flip{transform:scaleX(-1)}

  .pet{cursor:grab;touch-action:none}
  .pet:active{cursor:grabbing}
  .pet.pat{animation:wiggle .3s ease-in-out infinite}
  @keyframes wiggle{
    0%,100%{transform:translateX(-50%) rotate(-5deg)}
    50%{transform:translateX(-50%) rotate(5deg)}
  }

  .heart{
    position:absolute;
    font-size:16px;
    color:var(--rose);
    -webkit-text-stroke:1.5px var(--ink);
    paint-order:stroke fill;
    pointer-events:none;
    animation:rise .9s ease-out forwards;
  }
  @keyframes rise{
    0%{opacity:1;transform:translate(-50%,0) scale(.6)}
    100%{opacity:0;transform:translate(-50%,-56px) scale(1.15)}
  }

  .say{
    position:absolute;left:50%;bottom:56%;
    transform:translateX(-50%);
    font-size:20px;font-weight:800;
    color:var(--cream);
    -webkit-text-stroke:2px var(--ink);
    paint-order:stroke fill;
    opacity:0;
  }
  .say.show{animation:float 1.1s ease-out}
  @keyframes float{
    0%{opacity:1;transform:translate(-50%,0)}
    100%{opacity:0;transform:translate(-50%,-40px)}
  }

  .status{
    position:absolute;left:0;right:0;bottom:6px;
    text-align:center;font-size:11px;letter-spacing:.14em;text-indent:.14em;opacity:.75;
  }

  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
  button{
    font:inherit;font-size:13px;font-weight:700;letter-spacing:.14em;
    padding:13px 0;
    background:var(--cream);
    color:var(--ink);
    border:4px solid var(--ink);
    border-radius:16px;
    box-shadow:0 5px 0 var(--ink);
    cursor:pointer;
  }
  button:active{padding:17px 0 9px;box-shadow:0 1px 0 var(--ink)}
  button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
  button:disabled{opacity:.45;box-shadow:0 5px 0 var(--ink);cursor:default}

  .soup{
    position:absolute;left:50%;bottom:16%;
    transform:translateX(-50%);
    display:none;
  }
  .soup.show{display:block;animation:plop .45s ease-out}
  @keyframes plop{0%{transform:translateX(-50%) scale(.3)}70%{transform:translateX(-50%) scale(1.1)}100%{transform:translateX(-50%) scale(1)}}
  .steam{animation:steam 2.4s ease-in-out infinite}
  .steam:nth-child(2){animation-delay:.5s}
  .steam:nth-child(3){animation-delay:1s}
  @keyframes steam{
    0%{opacity:0;transform:translateY(4px)}
    40%{opacity:.7}
    100%{opacity:0;transform:translateY(-14px)}
  }

  .pet.crazed{animation:crazed .18s linear infinite}
  @keyframes crazed{
    0%{transform:translateX(-50%) rotate(-9deg) skewX(3deg)}
    25%{transform:translateX(-48%) rotate(7deg)}
    50%{transform:translateX(-52%) rotate(-5deg) skewX(-4deg)}
    75%{transform:translateX(-50%) rotate(10deg)}
    100%{transform:translateX(-49%) rotate(-9deg)}
  }

  .poop{
    position:absolute;
    width:30px;height:26px;
    transform:translateX(-50%);
    cursor:grab;touch-action:none;
    animation:plop .3s ease-out;
  }
  .poop.dragging{
    position:fixed;
    transform:none;
    z-index:99;
    cursor:grabbing;
    animation:none;
  }
  .poop.falling{
    transition:transform .8s cubic-bezier(.5,0,1,1),opacity .8s ease-in;
    pointer-events:none;
  }

  .debris{display:none}
  .screen.littered .debris{display:block}
  .debris svg{position:absolute;filter:none}
  .debris .d1{left:14%;bottom:12%;transform:rotate(-78deg)}
  .debris .d2{left:32%;bottom:10%;transform:rotate(9deg)}
  .debris .d3{right:20%;bottom:11%}
  .debris .d4{right:9%;bottom:9%;transform:rotate(64deg)}

  .pet.wreck{animation:twitch .5s steps(2,end) infinite}
  @keyframes twitch{
    0%{transform:translateX(-50%) rotate(-5deg) scaleY(.93)}
    100%{transform:translateX(-51%) rotate(-3deg) scaleY(.93)}
  }

  .feather{
    position:absolute;
    width:7px;height:3px;
    background:#FFF6E8;
    border:1.5px solid #14302B;
    border-radius:60% 40% 60% 40%;
    pointer-events:none;
    animation:fall 1.7s ease-in forwards;
  }
  @keyframes fall{
    0%{opacity:0;transform:translate(0,0) rotate(0)}
    15%{opacity:1}
    100%{opacity:0;transform:translate(var(--dx,6px),46px) rotate(220deg)}
  }

  .pet.collapsed{animation:none !important}

  .grass{display:none}
  .screen.overgrown .grass{display:block}
  .grass svg{
    position:absolute;
    transform-origin:50% 100%;
    animation:grow 1.1s ease-out both;
  }
  .grass .r1{left:12%;bottom:11%;animation-delay:.1s}
  .grass .r2{left:26%;bottom:9%;animation-delay:.5s}
  .grass .r3{left:44%;bottom:12%;animation-delay:.25s}
  .grass .r4{left:58%;bottom:9%;animation-delay:.8s}
  .grass .r5{right:22%;bottom:11%;animation-delay:.4s}
  .grass .r6{right:8%;bottom:10%;animation-delay:.95s}
  @keyframes grow{
    from{transform:scaleY(0) scaleX(.7);opacity:0}
    to{transform:scaleY(1) scaleX(1);opacity:1}
  }

  .ghost{
    position:absolute;
    pointer-events:none;
    opacity:0;
    filter:blur(.7px);
    animation:haunt 1.9s ease-in-out forwards;
  }
  @keyframes haunt{
    0%{opacity:0;transform:translateY(8px) scale(.88)}
    30%{opacity:.4}
    62%{opacity:.32}
    100%{opacity:0;transform:translateY(-14px) scale(1.05)}
  }
  #sweat{animation:drip 2.4s ease-in-out infinite}
  @keyframes drip{
    0%,100%{transform:translateY(0);opacity:.95}
    55%{transform:translateY(3px);opacity:.6}
  }

  .pet.leaving{
    animation:walkaway 1.5s ease-in forwards !important;
    transition:none !important;
  }
  @keyframes walkaway{
    0%{transform:translateX(-50%);opacity:1}
    70%{transform:translateX(40px);opacity:1}
    100%{transform:translateX(150px);opacity:0}
  }

  .tracks{display:none}
  .screen.left .tracks{display:block}
  .tracks svg{position:absolute;animation:step .5s ease-out both}
  .tracks .t1{left:30%;bottom:16%;transform:rotate(8deg);opacity:.85;animation-delay:1.20s}
  .tracks .t2{left:41%;bottom:13%;transform:rotate(14deg);opacity:.72;animation-delay:1.35s}
  .tracks .t3{left:52%;bottom:16%;transform:rotate(10deg);opacity:.58;animation-delay:1.50s}
  .tracks .t4{left:63%;bottom:12%;transform:rotate(18deg);opacity:.44;animation-delay:1.65s}
  .tracks .t5{left:74%;bottom:15%;transform:rotate(12deg);opacity:.3;animation-delay:1.80s}
  .tracks .t6{left:85%;bottom:12%;transform:rotate(16deg);opacity:.18;animation-delay:1.95s}
  .tracks .tf1{left:34%;bottom:22%;transform:rotate(-24deg);opacity:.9;animation-delay:1.40s}
  .tracks .tf2{left:58%;bottom:20%;transform:rotate(35deg);opacity:.8;animation-delay:1.70s}
  @keyframes step{from{opacity:0}}

  .serve{
    grid-column:1/-1;
    margin-top:14px;
    background:var(--ink);
    color:var(--cream);
    border-color:var(--cream);
    box-shadow:0 5px 0 var(--rose-deep);
  }
  .serve:active{padding:17px 0 9px;box-shadow:0 1px 0 var(--rose-deep)}
  .hidden{display:none}

  .reset{
    text-align:center;margin-top:14px;
    font-size:11px;letter-spacing:.2em;text-indent:.2em;
    color:var(--cream);opacity:.6;cursor:pointer;
  }
  .reset:active{opacity:1}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

    <div class="soup" id="soup">
      <svg viewBox="0 0 120 92" width="118" height="90">
        <g stroke="#14302B" stroke-width="3" stroke-linecap="round" fill="none" opacity=".8">
          <path class="steam" d="M46 20c-5-6 5-10 0-17"/>

        <path d="M10 4h6v9l4 7v17H6V20l4-7z" fill="#6FD3BE" stroke="#14302B" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M6 26h14" stroke="#14302B" stroke-width="2.2"/>

        <rect x="2" y="2" width="24" height="8" rx="3" fill="#FFF6E8" stroke="#14302B" stroke-width="2.4"/>
        <rect x="19" y="2" width="7" height="8" rx="2" fill="#FF2E7E" stroke="#14302B" stroke-width="2.4"/>
      </svg>

        <circle cx="9" cy="13" r="6" fill="#FF2E7E" stroke="#14302B" stroke-width="2.4"/>
        <circle cx="21" cy="15" r="4.5" fill="#FFF6E8" stroke="#14302B" stroke-width="2.4"/>

    <p class="say" id="say">咯</p>
    <p class="status" id="status">刚出壳，什么都不懂</p>

  <div class="pad">
    <button id="feed">喂 食</button>
    <button id="play">陪 玩</button>
    <button id="sleep">睡 觉</button>
    <button class="serve hidden" id="serve">上 桌</button>
  </div>
  <p class="reset" id="reset">长按这里重新养一只</p>

<script>
  const S = { full:78, mood:70, energy:85, born:Date.now(), asleep:false, served:false, servedAt:0, wrecked:false, bitter:false, watery:false, ash:false, collapsed:false, gone:false, frozenAt:false, blue:false, dark:false };
  const pet = document.getElementById('pet');
  const say = document.getElementById('say');
  const screen = document.getElementById('screen');
  const statusEl = document.getElementById('status');
  const eye = document.getElementById('eye');
  const eyeShut = document.getElementById('eyeShut');

  const clamp = v => Math.max(0, Math.min(100, v));
  const starvingNow = () => S.full < 30 || S.mood < 30 || S.asleep;

  function speak(text){
    say.textContent = text;
    say.classList.remove('show');
    void say.offsetWidth;
    say.classList.add('show');
  }

  function wander(){
    if (S.asleep || S.collapsed) return;
    const cur = parseFloat(pet.style.left) || 50;
    let next = 24 + Math.random() * 52;
    if (Math.abs(next - cur) < 8) next = cur + (cur > 50 ? -14 : 14);
    document.getElementById('inner').classList.toggle('flip', next < cur);
    pet.style.left = next + '%';
  }

  function mood(){
    if (S.asleep) return 'Zzz……别吵';
    if (S.gone) return '走了，地上只剩一串脚印';
    if (S.collapsed) return '一动不动，草从骨头缝里长出来了';
    let t;
    if (S.full < 30)        t = '瘦得只剩一副骨头';
    else if (S.mood < 30)   t = '眼神涣散，谁也不认识了';
    else if (S.energy < 20) t = '困得站不住了';
    else if (S.full < 45)   t = '有点饿了';
    else if (S.mood < 45)   t = '心情不太好';
    else if (S.full > 90)   t = '吃得有点撑';
    else if (S.full > 85 && S.mood > 75) t = '心满意足，来回踱步';
    else if (S.mood > 70)   t = '心情不错';
    else                    t = '发呆';
    if (poops >= 3) t += '，脚边全是屎';
    return t;
  }

  const FACES = ['faceSmile','faceBlush','faceFlat','faceCry'];
  let faceUntil = 0, faceTemp = null;

  function setFace(name, ms){
    faceTemp = name; faceUntil = Date.now() + ms;
    applyFace(name);
  }

  function applyFace(name){
    FACES.forEach(f => document.getElementById(f).style.display = (f === name) ? '' : 'none');
    eye.style.display = name ? 'none' : '';
  }

  function autoFace(){
    if (faceTemp && Date.now() < faceUntil) return applyFace(faceTemp);
    faceTemp = null;
    if (S.full > 90)      return applyFace('faceFlat');
    if (S.mood < 45)      return applyFace('faceCry');
    if (S.mood > 75)      return applyFace('faceSmile');
    applyFace(null);
  }

  // 一次算清当前处于什么形态，别处只读结论
  function phase(){
    const p = {};
    p.asleep   = S.asleep;
    p.down     = S.full <= 0 && !S.asleep;                  // 倒地：饱食度归零
    p.grown    = Math.floor((Date.now() - S.born) / 60000) >= 6;
    p.starving = S.full < 30;                                // 骨架
    p.gone     = !p.down && !S.asleep && S.mood <= 0 && S.energy <= 0;  // 离家出走
    p.wreck    = !S.asleep && S.mood < 30;                   // 萎靡
    p.showWreck  = p.wreck && !p.starving && !p.gone && !p.grown;
    p.skeleton   = p.starving && !p.down;
    p.tired      = !S.asleep && !p.wreck && !p.starving && !p.gone && !p.grown && S.energy < 30;
    p.plainFace  = !S.asleep && !p.wreck && !p.starving && !p.grown;
    p.hideEye    = S.asleep || p.wreck;
    if (p.wreck) S.wrecked = true;
    p.littered = S.wrecked;
    S.collapsed = p.down;
    if (p.gone) S.gone = true;
    p.gone = S.gone && !S.served;
    return p;
  }

  function render(){
    if (S.served){
      document.getElementById('age').textContent = '享年 ' + S.servedAt + ' 分钟';
      statusEl.textContent = S.ash    ? '一碗灰白的水，是它的骨灰'
                           : S.watery ? '清汤寡水，跟白水没两样'
                           : S.dark   ? '黑得看不见底，喝了吧'
                           : S.bitter ? '汤是苦的，还有股烟味'
                           : S.blue   ? '汤色发蓝，熬得太久了'
                           : '汤很鲜，就是有点烫';
      ['feed','play','sleep'].forEach(id => document.getElementById(id).disabled = true);
      return;
    }
    document.getElementById('b1').style.width = S.full + '%';
    document.getElementById('b2').style.width = S.mood + '%';
    document.getElementById('b3').style.width = S.energy + '%';
    const mins = Math.floor((Date.now() - S.born) / 60000);
    document.getElementById('age').textContent = '出生 ' + mins + ' 分钟';
    const P = phase();
    const show = (id, on) => document.getElementById(id).style.display = on ? '' : 'none';

    if (P.gone && !S.frozenAt){
      // 先把它此刻的实际位置钉住，避免过渡被掐断导致瞬移
      const pr = pet.getBoundingClientRect(), sr = screen.getBoundingClientRect();
      if (sr.width) pet.style.left = ((pr.left + pr.width / 2 - sr.left) / sr.width * 100) + '%';
      S.frozenAt = true;
      document.getElementById('inner').classList.remove('flip');
    }
    pet.classList.toggle('leaving', P.gone);
    screen.classList.toggle('left', P.gone);
    show('skeleton', P.skeleton && !P.gone);
    show('fallen',   P.down);
    show('alive',    !P.starving && !P.grown);
    show('adult',    !P.starving && P.grown);
    pet.classList.toggle('grown', P.grown && !P.starving);
    document.getElementById('inner').style.transform = P.down ? 'none' : '';

    if (P.down && poops > 0){
      screen.querySelectorAll('.poop').forEach(p => p.remove());
      poops = 0;
    }
    statusEl.textContent = mood();

    screen.classList.toggle('overgrown', P.down);
    pet.classList.toggle('collapsed',    P.down);
    screen.classList.toggle('littered',  P.littered);
    screen.classList.toggle('wreck',     P.showWreck);
    pet.classList.toggle('wreck',        P.showWreck);
    screen.classList.toggle('night',     P.asleep);
    pet.classList.toggle('sleeping',     P.asleep);
    show('wreckFace',  P.showWreck);
    show('tiredMarks', P.tired);
    eyeShut.style.display = P.asleep ? '' : 'none';

    if (P.plainFace) autoFace();
    else {
      FACES.forEach(f => show(f, false));
      eye.style.display = P.hideEye ? 'none' : '';
    }

    document.getElementById('feed').disabled  = P.asleep || P.down || P.gone;
    document.getElementById('play').disabled  = P.asleep || P.down || P.gone;
    document.getElementById('sleep').disabled = P.down || P.gone;
    document.getElementById('serve').disabled = P.gone;
    document.getElementById('sleep').textContent = S.asleep ? '叫 醒' : '睡 觉';
    if (mins >= 5) document.getElementById('serve').classList.remove('hidden');
  }

  document.getElementById('serve').onclick = () => {
    S.served = true;
    S.ash    = S.full <= 0;
    S.watery = !S.ash && S.full < 30;
    S.dark   = !S.ash && !S.watery && S.mood < 30 && S.energy < 30;
    S.bitter = !S.ash && !S.watery && !S.dark && S.mood < 30;
    S.blue   = !S.ash && !S.watery && !S.dark && !S.bitter && S.energy < 30;
    S.servedAt = Math.floor((Date.now() - S.born) / 60000);
    if (S.ash){
      document.getElementById('broth').setAttribute('fill', '#BFBCB4');
      document.getElementById('garnish').style.display = 'none';
    } else if (S.watery){
      document.getElementById('broth').setAttribute('fill', '#E7DBC0');
      document.getElementById('garnish').style.display = 'none';
    } else if (S.dark){
      document.getElementById('broth').setAttribute('fill', '#0E1712');
      document.getElementById('garnish').style.display = 'none';
    } else if (S.blue){
      document.getElementById('broth').setAttribute('fill', '#1C2B4A');
      document.getElementById('garnish').style.display = 'none';
    } else if (S.bitter){
      document.getElementById('broth').setAttribute('fill', '#6E7A33');
      document.getElementById('garnish').style.display = 'none';
      document.getElementById('butts').style.display = '';
    }
    pet.style.display = 'none';
    document.getElementById('soup').classList.add('show');
    speak('咯！');
    render();
  };

  document.getElementById('feed').onclick = () => {
    if (S.full > 92){ speak('吃不下'); S.mood = clamp(S.mood - 6); setFace('faceFlat', 2000); return render(); }
    S.full = clamp(S.full + 16);
    S.mood = clamp(S.mood + 4);
    pet.classList.add('eat');
    setTimeout(() => pet.classList.remove('eat'), 700);
    speak('咯咯');
    render();
  };

  document.getElementById('play').onclick = () => {
    if (S.energy < 15){ speak('累'); return render(); }
    S.mood = clamp(S.mood + 14);
    S.energy = clamp(S.energy - 9);
    S.full = clamp(S.full - 4);
    pet.classList.add('play');
    setTimeout(() => pet.classList.remove('play'), 900);
    speak('咯咯咯！');
    setFace('faceSmile', 2200);
    wander();
    render();
  };

  document.getElementById('sleep').onclick = () => {
    S.asleep = !S.asleep;
    speak(S.asleep ? 'Zzz' : '咯？');
    if (!S.asleep && S.energy < 40) S.mood = clamp(S.mood - 10);
    render();
  };

  setInterval(() => {
    if (S.served || S.collapsed || S.gone) return;
    if (S.asleep){
      S.energy = clamp(S.energy + 12);
      S.full = clamp(S.full - 1);
    } else {
      S.full = clamp(S.full - 2);
      S.energy = clamp(S.energy - 1.5);
      if (S.full < 25 || S.energy < 25) S.mood = clamp(S.mood - 3);
      else S.mood = clamp(S.mood - 1);
      if (Math.random() < (S.energy < 30 ? 0.95 : 0.55)) wander();
      if (Math.random() < 0.22) dropPoop();
      if (poops > 0) S.mood = clamp(S.mood - poops * 1.5);
      if (S.full < 15 && Math.random() < 0.5) speak('咯……');
    }
    render();
  }, 5000);

  // 摸摸：在小鸡身上按住来回蹭
  let patting = false, lastX = 0, strokes = 0, lastHeart = 0;

  function heart(clientX, clientY){
    const r = screen.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'heart';
    el.textContent = Math.random() < .3 ? '♪' : '♥';
    el.style.left = (clientX - r.left) + 'px';
    el.style.top  = (clientY - r.top - 14) + 'px';
    screen.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  pet.addEventListener('pointerdown', e => {
    e.preventDefault();
    pet.setPointerCapture(e.pointerId);
    patting = true;
    lastX = e.clientX;
    strokes = 0;
    if (S.asleep){
      speak('唔……');
      return;
    }
    pet.classList.add('pat');
    if (!starvingNow()) setFace('faceBlush', 2400);
  });

  pet.addEventListener('pointermove', e => {
    if (!patting || S.asleep) return;
    if (Math.abs(e.clientX - lastX) < 14) return;
    lastX = e.clientX;
    strokes++;
    const now = Date.now();
    if (now - lastHeart > 220){
      lastHeart = now;
      heart(e.clientX, e.clientY);
    }
    if (strokes % 3 === 0 && Math.random() < .5) speak('咕……');
  });

  function endPat(){
    if (!patting) return;
    patting = false;
    pet.classList.remove('pat');
    if (strokes > 0 && !S.asleep) speak(strokes > 8 ? '咯咯咯～' : '咯～');
  }
  pet.addEventListener('pointerup', endPat);
  pet.addEventListener('pointercancel', endPat);

  // 萎靡时慢慢掉毛
  setInterval(() => {
    if (S.served || S.asleep || S.gone || S.mood >= 30 || S.full < 30) return;
    const pr = pet.getBoundingClientRect();
    const sr = screen.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'feather';
    el.style.left = (pr.left - sr.left + 16 + Math.random() * 56) + 'px';
    el.style.top  = (pr.top  - sr.top  + 34 + Math.random() * 34) + 'px';
    el.style.setProperty('--dx', (Math.random() * 18 - 9) + 'px');
    screen.appendChild(el);
    setTimeout(() => el.remove(), 1750);
  }, 1100);

  // 便便：会自己出现，拖出粉色机身外就掉下去
  const shell = document.querySelector('.shell');
  let poops = 0;

  const POOP_SVG = `<svg viewBox="0 0 30 26" width="30" height="26">
    <path d="M7 24h16c3 0 4-4 1-5 2-2 1-5-2-5 1-3-1-5-4-4 0-3-4-4-6-1-3 0-4 3-2 5-3 0-4 3-2 5-3 1-2 5 1 5z"
      fill="#6B4A2F" stroke="#14302B" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="12" cy="16" r="1.6" fill="#14302B"/>
    <circle cx="19" cy="19" r="1.4" fill="#14302B"/>
  </svg>`;

  function dropPoop(silent, ){
    if (S.served || poops >= 4) return;
    const el = document.createElement('div');
    el.className = 'poop';
    el.innerHTML = POOP_SVG;
    const petLeft = parseFloat(pet.style.left || '50');
    el.style.left = Math.max(12, Math.min(88, petLeft + (Math.random() * 16 - 8))) + '%';
    el.style.bottom = '13%';
    screen.appendChild(el);
    poops++;
    if (!silent) speak('咯……');
    attachDrag(el);
  }

  function attachDrag(el){
    let dx = 0, dy = 0;
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();
      const r = el.getBoundingClientRect();
      dx = e.clientX - r.left;
      dy = e.clientY - r.top;
      document.body.appendChild(el);
      el.classList.add('dragging');
      el.style.left = r.left + 'px';
      el.style.top = r.top + 'px';
      el.style.bottom = 'auto';
      el.setPointerCapture(e.pointerId);

      const move = ev => {
        el.style.left = (ev.clientX - dx) + 'px';
        el.style.top = (ev.clientY - dy) + 'px';
      };
      const up = ev => {
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        const s = shell.getBoundingClientRect();
        const outside = ev.clientX < s.left || ev.clientX > s.right ||
                        ev.clientY < s.top  || ev.clientY > s.bottom;
        if (outside){
          el.classList.add('falling');
          requestAnimationFrame(() => {
            el.style.transform = 'translateY(' + (window.innerHeight + 120) + 'px) rotate(220deg)';
            el.style.opacity = '0';
          });
          setTimeout(() => el.remove(), 850);
          poops--;
          if (poops < 0) poops = 0;
        } else {
          const sr = screen.getBoundingClientRect();
          el.classList.remove('dragging');
          screen.appendChild(el);
          const x = Math.max(12, Math.min(88, ((ev.clientX - sr.left) / sr.width) * 100));
          el.style.left = x + '%';
          el.style.top = 'auto';
          el.style.bottom = '13%';
        }
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
    });
  }

  // 精神差：眼前晃过黑影
  const GHOST = `<svg viewBox="0 0 30 40" width="26" height="35">
    <path d="M15 2a13 13 0 0 1 13 13v20l-4.3-3.6-4.3 3.6-4.4-3.6-4.3 3.6L6 35V15A13 13 0 0 1 15 2z" fill="#14302B"/>
    <circle cx="10.5" cy="16" r="2.6" fill="#FFF6E8"/>
    <circle cx="19.5" cy="16" r="2.6" fill="#FFF6E8"/>
  </svg>`;

  setInterval(() => {
    if (S.served || S.asleep || S.collapsed || S.gone || S.energy >= 30) return;
    if (Math.random() > 0.55) return;
    const el = document.createElement('div');
    el.className = 'ghost';
    el.innerHTML = GHOST;
    el.style.left = (10 + Math.random() * 74) + '%';
    el.style.bottom = (18 + Math.random() * 42) + '%';
    screen.appendChild(el);
    setTimeout(() => el.remove(), 1950);
  }, 1300);

  // ——— 存档：只在自己的浏览器里有效 ———
  const KEY = 'gedan:v2';

  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({ S, poops, left: pet.style.left, at: Date.now() }));
    }catch(e){}
  }

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      Object.assign(S, d.S);
      if (d.left) pet.style.left = d.left;
      const mins = Math.min((Date.now() - (d.at || Date.now())) / 60000, 180);
      if (!S.served && !S.collapsed && !S.gone){
        if (S.asleep){
          S.energy = clamp(S.energy + mins * 3);
          S.full   = clamp(S.full   - mins * 0.5);
        } else {
          S.full   = clamp(S.full   - mins * 1.4);
          S.energy = clamp(S.energy - mins * 0.7);
          S.mood   = clamp(S.mood   - mins * 0.9);
        }
      }
      const n = Math.min(d.poops || 0, 4);
      for (let i = 0; i < n; i++) dropPoop(true);
    }catch(e){}
  }

  let holdTimer = null;
  const resetEl = document.getElementById('reset');
  resetEl.addEventListener('pointerdown', () => {
    resetEl.textContent = '松手就没了……';
    holdTimer = setTimeout(() => {
      try{ localStorage.removeItem(KEY); }catch(e){}
      location.reload();
    }, 1200);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev =>
    resetEl.addEventListener(ev, () => {
      clearTimeout(holdTimer);
      resetEl.textContent = '长按这里重新养一只';
    })
  );

  const _render = render;
  render = function(){ _render(); save(); };

  load();
  render();
</script>
</body>
</html>
